name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: wirebench-plugins

      # The SDK lives in the app repo and is not on PyPI — the `wirebench`
      # published there is an unrelated project, so it needs a name of its
      # own first. CI installs it by path; when it is published this becomes
      # one line and this checkout goes away. Until then, a CI that pretended
      # otherwise would be testing against somebody else's package.
      #
      # The app repo is PRIVATE, and a runner here cannot clone it with this
      # repository's own token, so this is allowed to fail: the SDK steps are
      # then skipped with a warning and the checks that live in THIS
      # repository still run. Set WIREBENCH_READ_TOKEN (a PAT with read access
      # to the app repo) to get validation back.
      - name: Check out wirebench for the SDK
        id: sdk
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: janslonecki/wirebench
          path: wirebench
          token: ${{ secrets.WIREBENCH_READ_TOKEN || secrets.WIREBENCH_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Zero dependencies by design, so this is a copy rather than a build.
      - name: Install the SDK
        if: steps.sdk.outcome == 'success'
        run: pip install -e ./wirebench/python

      - name: Language model protocol tests
        working-directory: wirebench-plugins
        run: node --test tools/test-llm.mjs

      - name: Every plugin declares this repository's licence
        working-directory: wirebench-plugins
        run: node tools/check-licences.mjs

      # `validate` and `pack` both exit non-zero with a readable problem list,
      # so they are the check — there is nothing to assert around them.
      - name: Validate and pack every plugin with the SDK
        if: steps.sdk.outcome == 'success'
        working-directory: wirebench-plugins
        run: |
          set -euo pipefail
          mkdir -p dist
          for dir in plugins/*/; do
            [ -f "$dir/wirebench-plugin.json" ] || continue
            name=$(basename "$dir")
            echo "── $name"
            # First-party: these plugins may carry the reserved keys that
            # name code paths inside wirebench, which the SDK refuses for
            # anyone else's. Everything else is checked as for a stranger.
            wirebench-plugin validate --first-party "$dir"
            wirebench-plugin pack --first-party "$dir" -o "dist/$name.wbplugin"
          done

      - name: Say so when the manifests were not validated
        if: steps.sdk.outcome != 'success'
        run: |
          echo "::warning title=Manifests not validated::No read access to janslonecki/wirebench, so the SDK could not be installed and wirebench-plugin validate did not run. Set the WIREBENCH_READ_TOKEN secret to restore it. The licence check and the signed-index check still ran."

      # The release packer agrees with itself: the same tree, the same bytes,
      # the same hashes a wirebench build would pin. Pure node, so it runs
      # whether or not the SDK was reachable — and a run that packed nothing
      # is not a passing run.
      - name: Pack with the release packer
        working-directory: wirebench-plugins
        run: |
          set -euo pipefail
          node tools/release.mjs
          found=$(ls -1 dist/*.wbplugin 2>/dev/null | wc -l | tr -d ' ')
          if [ "$found" -eq 0 ]; then
            echo "no plugins found — refusing the silent green" >&2
            exit 1
          fi
          echo "packed $found plugin(s)"

      # The committed index has to match the tree AND carry a good signature.
      # CI only verifies — the signing key is the maintainer's and is in no
      # secret here, because a compromise of this repository must not be able
      # to publish something wirebench installs by itself.
      - name: releases.json is current and correctly signed
        working-directory: wirebench-plugins
        run: node tools/release.mjs --check

      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: wirebench-plugins/dist/*.wbplugin
          if-no-files-found: error
