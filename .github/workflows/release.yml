name: Release

# A tag `v<date>` cuts a release: every plugin packed by `tools/release.mjs`
# — one packer, so the bytes and the hashes are the same whoever cut it —
# and uploaded beside `releases.json`, the file a wirebench build pins its
# first-party plugins against, updates from, and — since 2026-08-29 — lists
# in Preferences ▸ Plugins. The release notes name each plugin's version and
# content hash, because the hash is what a wirebench build has to carry.
#
# Nothing binary is ever attached: a `.wbplugin` is text. The programs these
# plugins declare stay on their authors' release pages, pinned by checksum
# inside the manifests (wirebench docs/interop-legal.md §The plugin umbrella).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: wirebench-plugins

      # The SDK lives in the app repo (not on PyPI — that name is somebody
      # else's), so it is installed by path. That repo is PRIVATE, and a
      # runner here cannot clone it with this repository's own token, so the
      # checkout is allowed to fail: manifest validation is then skipped, with
      # a warning, and the release's own gates — the licence check and
      # `release.mjs --check`, both local to this repository — still run.
      # Set WIREBENCH_READ_TOKEN (a PAT with read access to the app repo) to
      # get validation back.
      - name: Check out wirebench for the SDK
        id: sdk
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: janslonecki/wirebench
          path: wirebench
          token: ${{ secrets.WIREBENCH_READ_TOKEN || secrets.WIREBENCH_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the SDK
        if: steps.sdk.outcome == 'success'
        run: pip install -e ./wirebench/python

      - name: Language model protocol tests
        working-directory: wirebench-plugins
        run: node --test tools/test-llm.mjs

      - name: Every plugin declares this repository's licence
        working-directory: wirebench-plugins
        run: node tools/check-licences.mjs

      # First-party: these plugins carry the reserved keys that name code
      # paths inside wirebench, which the SDK refuses for anyone else's.
      - name: Validate every plugin as first party
        if: steps.sdk.outcome == 'success'
        working-directory: wirebench-plugins
        run: |
          set -euo pipefail
          for dir in plugins/*/; do
            [ -f "$dir/wirebench-plugin.json" ] || continue
            wirebench-plugin validate --first-party "$dir"
          done

      - name: Say so when the manifests were not validated
        if: steps.sdk.outcome != 'success'
        run: |
          echo "::warning title=Manifests not validated::No read access to janslonecki/wirebench, so the SDK could not be installed and wirebench-plugin validate did not run. Set the WIREBENCH_READ_TOKEN secret to restore it. The licence check and the signed-index check still ran."

      - name: Pack, and check the committed index
        working-directory: wirebench-plugins
        # `--check` refuses a stale index, a missing signature, and one that
        # does not verify against the committed public key. Signing itself
        # happened on the maintainer's machine before the tag: the private key
        # is in no secret here, so a compromised workflow cannot mint a
        # release that wirebench would install by itself.
        run: |
          set -euo pipefail
          node tools/release.mjs
          node tools/release.mjs --check

      - name: Build Claude Desktop extension
        working-directory: wirebench-plugins
        run: python3 tools/build-mcpb.py

      - name: Publish
        working-directory: wirebench-plugins
        env:
          GH_TOKEN: ${{ github.token }}
        # Two lessons are baked into these four lines, both learned by this
        # step failing silently:
        #
        #   * The notes are built by a SCRIPT IN THE REPOSITORY, not by an
        #     inline `node -e '…'`. Shell single quotes end at the first
        #     apostrophe, so prose ("the file's") tore the script in half and
        #     the rest was run as shell commands.
        #   * They are passed as a FILE. A `--notes "…"` argument spanning a
        #     blank line and continuing at column 0 ENDS the YAML block scalar,
        #     which is why every run from 2026-08-28 failed before a single job
        #     started. Keep every line of this block indented past `run:`.
        run: |
          set -uo pipefail
          node tools/release-notes.mjs > "$RUNNER_TEMP/notes.md"
          ls -1 dist/*.wbplugin
          # Create or UPDATE. Re-cutting a tag has to work: the first release
          # this repository ever published took four attempts, and every retry
          # after the first would have died on "a release with that tag
          # already exists" while the assets were still wrong. `--clobber`
          # replaces an asset of the same name rather than refusing it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            verb="updated"
            # `--draft=false` is not tidiness. DELETING A TAG TURNS ITS RELEASE
            # INTO A DRAFT, and a draft is invisible to everyone without a
            # token: `gh release view` still finds it, so an edit reports
            # success, while `releases/latest/download/...` — the URL every
            # wirebench build fetches — answers 404. That is exactly how this
            # repository spent an afternoon with a green release and nothing
            # published.
            cmd=(gh release edit "$GITHUB_REF_NAME" --draft=false --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md")
          else
            verb="created"
            cmd=(gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md")
          fi
          # gh's reason for refusing goes into an ERROR ANNOTATION, not just
          # into the log: a log needs a token to read, an annotation does not,
          # and the last time this failed the run said only "exit code 1".
          if ! out=$("${cmd[@]}" 2>&1); then
            echo "$out"
            echo "::error title=gh release $verb failed::${out//$'\n'/ § }"
            exit 1
          fi
          echo "$out"
          if ! out=$(gh release upload "$GITHUB_REF_NAME" --clobber \
              dist/*.wbplugin dist/*.mcpb releases.json releases.json.sig 2>&1); then
            echo "$out"
            echo "::error title=gh release upload failed::${out//$'\n'/ § }"
            exit 1
          fi
          echo "$out"
          echo "::notice title=Release $verb::$GITHUB_REF_NAME"
