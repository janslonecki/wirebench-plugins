name: Release

# A tag `v<date>` cuts a release: every plugin packed by `tools/release.mjs`
# — one packer, so the bytes and the hashes are the same whoever cut it —
# and uploaded beside `releases.json`, the file a wirebench build pins its
# first-party plugins against, updates from, and — since 2026-08-29 — lists
# in Preferences ▸ Plugins. The release notes name each plugin's version and
# content hash, because the hash is what a wirebench build has to carry.
#
# Nothing binary is ever attached: a `.wbplugin` is text. The programs these
# plugins declare stay on their authors' release pages, pinned by checksum
# inside the manifests (wirebench docs/interop-legal.md §The plugin umbrella).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: wirebench-plugins

      # The SDK lives in the app repo (not on PyPI — that name is somebody
      # else's), so it is installed by path. That repo is PRIVATE, and a
      # runner here cannot clone it with this repository's own token, so the
      # checkout is allowed to fail: manifest validation is then skipped, with
      # a warning, and the release's own gates — the licence check and
      # `release.mjs --check`, both local to this repository — still run.
      # Set WIREBENCH_READ_TOKEN (a PAT with read access to the app repo) to
      # get validation back.
      - name: Check out wirebench for the SDK
        id: sdk
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: janslonecki/wirebench
          path: wirebench
          token: ${{ secrets.WIREBENCH_READ_TOKEN || secrets.WIREBENCH_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the SDK
        if: steps.sdk.outcome == 'success'
        run: pip install -e ./wirebench/python

      - name: Every plugin declares this repository's licence
        working-directory: wirebench-plugins
        run: node tools/check-licences.mjs

      # First-party: these plugins carry the reserved keys that name code
      # paths inside wirebench, which the SDK refuses for anyone else's.
      - name: Validate every plugin as first party
        if: steps.sdk.outcome == 'success'
        working-directory: wirebench-plugins
        run: |
          set -euo pipefail
          for dir in plugins/*/; do
            [ -f "$dir/wirebench-plugin.json" ] || continue
            wirebench-plugin validate --first-party "$dir"
          done

      - name: Say so when the manifests were not validated
        if: steps.sdk.outcome != 'success'
        run: |
          echo "::warning title=Manifests not validated::No read access to janslonecki/wirebench, so the SDK could not be installed and wirebench-plugin validate did not run. Set the WIREBENCH_READ_TOKEN secret to restore it. The licence check and the signed-index check still ran."

      - name: Pack, and check the committed index
        working-directory: wirebench-plugins
        # `--check` refuses a stale index, a missing signature, and one that
        # does not verify against the committed public key. Signing itself
        # happened on the maintainer's machine before the tag: the private key
        # is in no secret here, so a compromised workflow cannot mint a
        # release that wirebench would install by itself.
        run: |
          set -euo pipefail
          node tools/release.mjs
          node tools/release.mjs --check

      - name: Publish
        working-directory: wirebench-plugins
        env:
          GH_TOKEN: ${{ github.token }}
        # The notes body is assembled in full by node and passed as a FILE.
        # It used to be spliced into a `--notes "…"` argument carrying a blank
        # line and then a line at column 0 — which ENDS a YAML block scalar,
        # so this workflow did not parse and every run from 2026-08-28 failed
        # before a single job started, with no release ever published and
        # nothing in the log to say why. Keep every line of this block
        # indented past `run:`.
        run: |
          set -euo pipefail
          node -e '
            const r = require("./releases.json");
            const rows = r.plugins.map(
              (p) => `- **${p.id}** ${p.version} — sha256 \`${p.sha256}\` · content \`${p.contentHash}\``,
            );
            console.log(
              [
                "Packed by tools/release.mjs. A wirebench build pins a plugin by its content hash; the sha256 is the file's.",
                "`releases.json` is signed by the maintainer's release key — a wirebench build verifies it before treating any entry as first-party, and Preferences ▸ Plugins lists what it names.",
                "",
                ...rows,
              ].join("\n"),
            );
          ' > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/*.wbplugin releases.json releases.json.sig \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"
